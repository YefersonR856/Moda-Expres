<!-- 
  @file login.html
  @description Interfaz del módulo de autenticación y acceso seguro (Atelier Personal) de Moda Express.
  @author Yeferson Stiven Murcia Romero
  @version 2.0.0 (V-02: Maquetación Premium Split-Screen)
  @framework Tecnologías Web Nativas (HTML5 / CSS3 Avanzado)
  @lifecycle Pantalla de control de acceso orientada al usuario final y administradores (GA7-220501096-AA3-EV01).
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODA EXPRESS | Autenticación Atemporal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <!-- Vinculación a la hoja de estilos compartida styles.css -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* MAQUETACIÓN: PANTALLA DIVIDIDA (Split Screen Design Architecture) */
        .login-layout {
            min-height: calc(100vh - 76px);
            display: flex;
        }

        .login-split-img {
            flex: 1.2;
            background: url('https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=1200') no-repeat center center/cover;
            display: block;
        }

        .login-split-form {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 10%;
            background: var(--blanco-puro);
        }

        /* ENCABEZADOS INFORMATIVOS DEL FORMULARIO */
        .form-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .form-subtitle {
            font-size: 0.85rem;
            color: #767676;
            margin-bottom: 35px;
        }

        /* CONTROLES ADICIONALES: RECORDATORIO Y RECUPERACIÓN DE CUENTAS */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            margin-bottom: 25px;
        }

        .options-row a {
            color: #767676;
            text-decoration: none;
        }

        /* PIE DE CAMBIO DE CONTEXTO (Sign-Up Switcher) */
        .footer-switch {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            color: #767676;
        }

        .footer-switch a {
            color: var(--negro-mate);
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1><a href="index.html" style="color: inherit; text-decoration: none;">MODA EXPRESS</a></h1>
        <nav>
            <a href="index.html">Colecciones</a>
            <a href="login.html">Acceder</a>
        </nav>
    </header>

    <div class="login-layout">
        <div class="login-split-img"></div>

        <div class="login-split-form">
            <h2 class="form-title">Bienvenido de regreso</h2>
            <p class="form-subtitle">Ingresa tus credenciales para acceder a tu Atelier personal.</p>

            <form id="form-login" class="form-admin" style="border: none; padding: 0; margin-bottom: 0; box-shadow: none;">
                <div class="form-group">
                    <label>Dirección de Correo Electrónico</label>
                    <input type="email" id="txt-email" placeholder="nombre@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="txt-password" placeholder="••••••••••••" required>
                </div>

                <div class="options-row">
                    <label><input type="checkbox"> Recordar sesión</label>
                    <a href="#" onclick="alert('Funcionalidad de recuperación en mantenimiento.');">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>

            <p class="footer-switch">¿Nuevo en la Maison? <a href="#" onclick="alert('El registro de nuevos clientes está temporalmente cerrado por lanzamiento de temporada.');">Crear una cuenta</a></p>
        </div>
    </div>

    <script>
        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault(); // Detiene el refresco de página por defecto

            // Capturar las credenciales ingresadas por el usuario
            const email = document.getElementById('txt-email').value.trim();
            const password = document.getElementById('txt-password').value;

            if (password.length < 4) {
                alert('La contraseña debe tener al menos 4 caracteres.');
                return;
            }

            // Validación de control de acceso basada en roles
            if (email === 'admin@modaexpress.com' && password === 'admin123') {
                sessionStorage.setItem('sesionModaExpress', JSON.stringify({ email, rol: 'admin' }));
                alert('✨ Autenticación exitosa como Administrador.\nAccediendo al Studio Dashboard...');
                window.location.href = 'admin.html'; // Redirige al panel de administración
            } else {
                // Simulación para cualquier otro usuario o cliente regular
                sessionStorage.setItem('sesionModaExpress', JSON.stringify({ email, rol: 'cliente' }));
                alert(`👋 ¡Bienvenido de vuelta!\nSesión iniciada correctamente con el correo: ${email}`);
                window.location.href = 'index.html'; // Redirige a la tienda principal
            }
        });
    </script>
</body>
</html>
