<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODA EXPRESS | Checkout Seguro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <!-- Vinculación a la hoja de estilos compartida styles.css -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* MAQUETACIÓN ASIMÉTRICA EN DOS COLUMNAS (Formularios vs Resumen) */
        .checkout-container {
            max-width: 1200px;
            margin: 0 auto 100px auto;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
        }

        h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.6rem; font-weight: 400; margin-bottom: 30px; }
        
        /* BLOQUES DE SECCIÓN DEL PANEL */
        .section-block {
            background: var(--blanco-puro);
            padding: 40px;
            border: 1px solid var(--gris-borde);
            margin-bottom: 30px;
            border-radius: 8px;
        }

        /* CONTENEDOR GRID PARA CAMPOS DE ENTRADA (Inputs Grid) */
        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .full-width { grid-column: span 2; }

        /* COMPONENTE: PANEL DE RESUMEN DE COMPRA FIJO (Sticky Order Summary) */
        .order-summary {
            background: var(--blanco-puro);
            border: 1px solid var(--gris-borde);
            padding: 40px;
            position: sticky;
            top: 40px;
            height: fit-content;
            border-radius: 8px;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        .summary-total {
            border-top: 1px solid var(--gris-borde);
            padding-top: 20px;
            margin-top: 20px;
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        /* Contenedor interno dinámico para listar la ropa */
        .checkout-items-lista {
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--gris-borde);
            padding-bottom: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1><a href="index.html" style="color: inherit; text-decoration: none;">MODA EXPRESS</a></h1>
        <nav>
            <a href="index.html">Colecciones</a>
            <a href="checkout.html">Checkout</a>
        </nav>
    </header>

    <form id="form-checkout" class="checkout-container">
        
        <div>
            <div class="section-block">
                <h2>01. Dirección de Envío</h2>
                <div class="grid-inputs">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="txt-nombre-envio" placeholder="Yeferson" required>
                    </div>
                    <div class="form-group">
                        <label>Apellido</label>
                        <input type="text" id="txt-apellido-envio" placeholder="Murcia" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Dirección</label>
                        <input type="text" id="txt-direccion-envio" placeholder="Calle 10 #2-34, Barrio Centro" required>
                    </div>
                    <div class="form-group">
                        <label>Ciudad</label>
                        <input type="text" id="txt-ciudad-envio" placeholder="Pitalito" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" id="txt-telefono-envio" placeholder="312 345 6789" required>
                    </div>
                </div>
            </div>

            <div class="section-block">
                <h2>02. Detalles de Pago</h2>
                <div class="grid-inputs">
                    <div class="form-group full-width">
                        <label>Número de Tarjeta</label>
                        <input type="text" id="txt-tarjeta" placeholder="4556 •••• •••• 8901" required>
                    </div>
                    <div class="form-group">
                        <label>Fecha de Expiración</label>
                        <input type="text" id="txt-expiracion" placeholder="MM/AA" required>
                    </div>
                    <div class="form-group">
                        <label>CVC / CVV</label>
                        <input type="password" id="txt-cvc" placeholder="•••" required>
                    </div>
                </div>
            </div>
        </div>

        <div class="order-summary">
            <h2>Tu Orden</h2>
            
            <div id="checkout-productos-lista" class="checkout-items-lista">
                </div>
            
            <div class="summary-item">
                <span>Subtotal</span>
                <span id="lbl-subtotal">$0 COP</span>
            </div>
            <div class="summary-item">
                <span>IVA (19%)</span>
                <span id="lbl-iva">$0 COP</span>
            </div>
            <div class="summary-item">
                <span>Envío Express</span>
                <span style="color: var(--verde-menta-hover); font-weight: 600;">Gratuito</span>
            </div>
            
            <div class="summary-item summary-total">
                <span>Total</span>
                <span id="lbl-total">$0 COP</span>
            </div>

            <button type="submit" id="btn-pagar" class="btn-primary">Autorizar y Pagar Pedido</button>
        </div>

    </form>

    <script>
        // Cargar el estado actual del carrito desde la persistencia local
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];

        /**
         * Escapa caracteres especiales para renderizado seguro en HTML.
         */
        function escaparHTML(valor) {
            return String(valor ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /**
         * Renderiza los productos seleccionados y calcula la liquidación financiera en el Checkout.
         */
        function inicializarResumenCheckout() {
            const listaContenedor = document.getElementById('checkout-productos-lista');
            
            if (carrito.length === 0) {
                listaContenedor.innerHTML = '<p style="font-size: 0.85rem;">No hay prendas en tu orden actual.</p>';
                document.getElementById('lbl-subtotal').innerText = '$0 COP';
                document.getElementById('lbl-iva').innerText = '$0 COP';
                document.getElementById('lbl-total').innerText = '$0 COP';
                return;
            }

            // Inyección dinámica de las líneas de producto correspondientes
            listaContenedor.innerHTML = carrito.map(item => `
                <div class="summary-item" style="margin-bottom: 12px;">
                    <span><strong>${escaparHTML(item.nombre)}</strong> (x${Number(item.cantidad) || 0})</span>
                    <span>$${((Number(item.precio) || 0) * (Number(item.cantidad) || 0)).toLocaleString('es-CO')} COP</span>
                </div>
            `).join('');

            // Cálculos financieros precisos y redondeados para COP
            let subtotal = carrito.reduce((acc, current) => acc + ((Number(current.precio) || 0) * (Number(current.cantidad) || 0)), 0);
            let iva = Math.round(subtotal * 0.19);
            let total = subtotal + iva;

            // Inyectar etiquetas calculadas con formato monetario localizado
            document.getElementById('lbl-subtotal').innerText = `$${subtotal.toLocaleString('es-CO')} COP`;
            document.getElementById('lbl-iva').innerText = `$${iva.toLocaleString('es-CO')} COP`;
            document.getElementById('lbl-total').innerText = `$${total.toLocaleString('es-CO')} COP`;
        }

        // Manejador del evento de envío del formulario de checkout
        document.getElementById('form-checkout').addEventListener('submit', async (e) => {
            e.preventDefault(); // Detener el refresco por defecto de la página

            if (carrito.length === 0) {
                alert("Operación denegada: El carro de compras no contiene productos para procesar.");
                return;
            }

            const btnPagar = document.getElementById('btn-pagar');
            btnPagar.disabled = true;

            const datosEnvio = {
                nombre: document.getElementById('txt-nombre-envio').value.trim(),
                apellido: document.getElementById('txt-apellido-envio').value.trim(),
                direccion: document.getElementById('txt-direccion-envio').value.trim(),
                ciudad: document.getElementById('txt-ciudad-envio').value.trim(),
                telefono: document.getElementById('txt-telefono-envio').value.trim()
            };

            try {
                // Despachar petición HTTP POST estructurada hacia la API del Backend
                const respuesta = await fetch('/api/comprar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ carrito: carrito, envio: datosEnvio })
                });

                const resultado = await respuesta.json();

                if (respuesta.ok && resultado.estatus === "OK") {
                    alert(`🎉 ¡Éxito en la transacción!\n\n${resultado.mensaje}`);
                    localStorage.removeItem('carrito'); // Vaciar el buffer del carrito local
                    window.location.href = 'index.html'; // Redirigir de vuelta a la vitrina virtual
                } else {
                    alert(`❌ Error operativo: ${resultado.mensaje || 'No se pudo completar la orden.'}`);
                    btnPagar.disabled = false;
                }
            } catch (error) {
                console.error("Error en la petición de compra:", error);
                alert("Error de red: No se pudo establecer conexión de alta disponibilidad con el servidor de pasarela.");
                btnPagar.disabled = false;
            }
        });

        // Invocar renderizado al cargarse el documento
        window.onload = inicializarResumenCheckout;
    </script>
</body>
</html>
