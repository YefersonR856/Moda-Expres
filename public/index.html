<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODA EXPRESS | High Luxury E-Commerce</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Vinculación a la hoja de estilos compartida styles.css -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* MAQUETACIÓN: SECCIÓN HERO DE BIENVENIDA (Banner Inmersivo) */
        .hero {
            position: relative;
            height: 60vh;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1600') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .hero h2 {
            font-family: var(--font-serif, 'Playfair Display', Georgia, serif);
            font-size: 3.5rem;
            font-weight: 400;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .hero p {
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .section-title {
            font-family: var(--font-serif, 'Playfair Display', Georgia, serif);
            font-size: 2rem;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .image-placeholder {
            width: 100%;
            height: 260px;
            background: #eee no-repeat center center/cover;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .card-producto .meta {
            font-size: 0.85rem;
            color: #767676;
            margin-bottom: 8px;
        }

        /* =====================================================================
           INTEGRACIÓN DE COMPONENTE V-02: CONTENEDOR INTEGRAL DEL CARRITO EN PIE
           ===================================================================== */
        .carrito-pie-container {
            max-width: 600px;
            margin: 60px auto 40px auto;
            background: var(--blanco-puro);
            border: 1px solid var(--gris-borde);
            padding: 40px;
            border-radius: 8px;
        }

        .carrito-pie-container h2 {
            font-family: var(--font-serif, 'Playfair Display', Georgia, serif);
            font-size: 1.6rem;
            font-weight: 400;
            margin-bottom: 25px;
            text-align: left;
        }

        .carrito-vacio-msg {
            color: #767676;
            font-size: 0.9rem;
            margin-bottom: 25px;
            padding: 10px 0;
        }

        /* Elemento dinámico para listar items agregados dentro del pie */
        .carrito-items-lista {
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .carrito-item-linea {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--gris-borde);
        }

        /* FILAS ESTRUCTURALES DE VALORES FINANCIEROS (COP) */
        .carrito-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 15px;
            color: #767676;
        }

        .carrito-total-row.total-final {
            border-top: 1px solid var(--gris-borde);
            padding-top: 20px;
            margin-top: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--negro-mate);
        }

        /* CONTROL DE ENLACE DIRECTO HACIA MÓDULO DE PASARELA SECURE */
        .btn-checkout-pie {
            width: 100%;
            background: var(--verde-menta);
            color: var(--blanco-puro);
            border: none;
            padding: 16px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
            text-align: center;
            display: block;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn-checkout-pie:hover {
            background: var(--verde-menta-hover);
        }
    </style>
</head>
<body>

    <header>
        <h1>MODA EXPRESS</h1>
        <nav>
            <a href="index.html">Colecciones</a>
            <a href="login.html">Acceder</a>
            <a href="checkout.html">Checkout</a>
            <a href="admin.html">Studio Admin</a>
        </nav>
    </header>

    <div class="hero">
        <p>Nueva Colección Otoño / Invierno</p>
        <h2>THIS IS NEW LUXURY</h2>
        <a href="#catalogo-productos" class="btn-primary" style="display: inline-block; width: auto; text-decoration: none;">Explorar Atelier</a>
    </div>

    <div class="container">
        <h2 class="section-title">Prendas de Temporada</h2>
        
        <div class="catalogo-grid" id="catalogo-productos">
        </div>

        <div class="carrito-pie-container">
            <h2>Tu Carrito de Compras</h2>
            
            <div id="lista-items-carrito" class="carrito-items-lista"></div>
            
            <div class="carrito-vacio-msg" id="msg-vacio">Tu carrito está vacío.</div>
            
            <div class="carrito-total-row">
                <span>Subtotal</span>
                <span id="txt-subtotal">$0 COP</span>
            </div>
            <div class="carrito-total-row">
                <span>IVA (19%)</span>
                <span id="txt-iva">$0 COP</span>
            </div>
            
            <div class="carrito-total-row total-final">
                <span>Total</span>
                <span id="txt-total">$0 COP</span>
            </div>

            <a href="checkout.html" class="btn-checkout-pie">Proceder al Pago Seguro</a>
        </div>

    </div>

    <script>
        // Array de estado global persistido localmente para el carrito
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        let catalogoActual = [];

        /**
         * Escapa caracteres especiales para evitar inyección HTML al renderizar datos dinámicos.
         */
        function escaparHTML(valor) {
            return String(valor ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /**
         * Valida que la URL de imagen use protocolo http o https para evitar esquemas peligrosos.
         */
        function validarURLImagen(url) {
            const fallback = 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600';
            try {
                const parsed = new URL(url);
                if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
                    return parsed.href;
                }
                return fallback;
            } catch (_) {
                return fallback;
            }
        }

        /**
         * Consume la API local de productos para renderizar dinámicamente la grilla del catálogo.
         */
        async function fetchCatalogo() {
            try {
                const response = await fetch('/api/productos');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const productos = await response.json();
                catalogoActual = productos;
                const grid = document.getElementById('catalogo-productos');
                
                // Mapeo e inyección semántica de tarjetas de producto basadas en el inventario del servidor
                grid.innerHTML = productos.map(prod => {
                    // Mapear dinámicamente la URL de recurso gráfico estático provisto por la API
                    let imgUrl = validarURLImagen(prod.imagen);
                    const sinStock = Number(prod.stock) <= 0;

                    return `
                        <div class="card-producto">
                            <div class="image-placeholder" style="background-image: url('${imgUrl}');"></div>
                            <h3>${escaparHTML(prod.nombre)}</h3>
                            <div class="meta">Categoría: ${escaparHTML(prod.categoria)} | Talla: ${escaparHTML(prod.talla)} | Color: ${escaparHTML(prod.color)}</div>
                            <div class="meta" style="font-weight: 600; color: #c0392b;">Disponibles: ${Number(prod.stock) || 0} uds</div>
                            <div class="precio">$${(Number(prod.precio) || 0).toLocaleString('es-CO')} COP</div>
                            <button class="btn-primary" ${sinStock ? 'disabled' : ''} onclick="agregarProducto(${Number(prod.id)})">${sinStock ? 'Agotado' : 'Añadir al Carrito'}</button>
                        </div>
                    `;
                }).join('');
                
                renderCarritoPie();
            } catch (error) {
                console.error("Error crítico recuperando el catálogo desde la API:", error);
            }
        }

        /**
         * Inserta una prenda en el carro de compras validando stock local de la vitrina.
         */
        function agregarProducto(id) {
            const producto = catalogoActual.find(p => Number(p.id) === Number(id));
            if (!producto) return;

            const { nombre, precio, stock: stockMax } = producto;
            const itemExistente = carrito.find(item => item.id === producto.id);
            const cantidadActual = itemExistente ? itemExistente.cantidad : 0;

            if (cantidadActual >= stockMax) {
                alert(`Lo sentimos. No es posible agregar más unidades de "${nombre}". Stock máximo alcanzado.`);
                return;
            }

            if (itemExistente) {
                itemExistente.cantidad += 1;
            } else {
                carrito.push({ id: producto.id, nombre, precio, cantidad: 1 });
            }

            // Persistir cambios y actualizar vista
            localStorage.setItem('carrito', JSON.stringify(carrito));
            renderCarritoPie();
        }

        /**
         * Renderiza los cálculos financieros e ítems en el módulo de pie de página.
         */
        function renderCarritoPie() {
            const listaDiv = document.getElementById('lista-items-carrito');
            const msgVacio = document.getElementById('msg-vacio');
            
            if (carrito.length === 0) {
                listaDiv.innerHTML = '';
                msgVacio.style.display = 'block';
                document.getElementById('txt-subtotal').innerText = '$0 COP';
                document.getElementById('txt-iva').innerText = '$0 COP';
                document.getElementById('txt-total').innerText = '$0 COP';
                return;
            }

            msgVacio.style.display = 'none';
            
            // Render de renglones individuales
            listaDiv.innerHTML = carrito.map(item => `
                <div class="carrito-item-linea">
                    <span>• ${escaparHTML(item.nombre)} <strong>(x${Number(item.cantidad) || 0})</strong></span>
                    <span>$${((Number(item.precio) || 0) * (Number(item.cantidad) || 0)).toLocaleString('es-CO')} COP</span>
                </div>
            `).join('');

            // Operaciones aritméticas de liquidación y redondeo para COP
            let subtotal = carrito.reduce((acc, current) => acc + ((Number(current.precio) || 0) * (Number(current.cantidad) || 0)), 0);
            let iva = Math.round(subtotal * 0.19);
            let total = subtotal + iva;

            // Inyección de valores calculados con formato localizado
            document.getElementById('txt-subtotal').innerText = `$${subtotal.toLocaleString('es-CO')} COP`;
            document.getElementById('txt-iva').innerText = `$${iva.toLocaleString('es-CO')} COP`;
            document.getElementById('txt-total').innerText = `$${total.toLocaleString('es-CO')} COP`;
        }

        // Inicialización del script al completar la carga del DOM
        window.onload = fetchCatalogo;
    </script>
</body>
</html>
